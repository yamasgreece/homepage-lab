<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Homepage Lab · δοκιμαστικές παραλλαγές</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#07070c;color:#f2f2f7;min-height:100vh;display:grid;place-items:center;padding:40px;
background-image:radial-gradient(600px 400px at 20% 10%,rgba(228,72,63,.18),transparent 60%),radial-gradient(600px 400px at 80% 90%,rgba(232,162,61,.16),transparent 60%)}
.wrap{max-width:760px;text-align:center}
h1{font-family:Fraunces,serif;font-weight:600;font-size:clamp(30px,6vw,52px);letter-spacing:-.02em;margin-bottom:10px}
p.sub{color:#a7a7b5;margin-bottom:36px;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
a.card{display:block;padding:30px 26px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:rgba(255,255,255,.04);text-decoration:none;color:inherit;transition:.2s;text-align:left}
a.card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.07)}
a.card h2{font-family:Fraunces,serif;font-size:24px;font-weight:600;margin-bottom:6px}
a.card span{color:#9a9aa8;font-size:14.5px}
.note{margin-top:34px;color:#6f6f7d;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>Homepage Lab</h1>
<p class="sub">Δοκιμαστικές, award-style animated παραλλαγές αρχικής σελίδας. Δεν είναι production.</p>
<div class="grid">
<a class="card" href="./vane/"><h2>VANE →</h2><span>Cinematic dark variant — Mediterranean hotel &amp; restaurant review brand</span></a>
<a class="card" href="./yamas/"><h2>Yamas Greece →</h2><span>Warm cinematic variant — Athens food tour</span></a>
</div>
<p class="note">Design test · Σεπτέμβριος 2026</p>
</div>
</body>
</html>
